<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einmaleins Training: 3 & 4</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animation for incorrect answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake { 
            animation: shake 0.4s ease-in-out; 
        }
        /* Large touch targets without double-tap zoom while entering an answer. */
        .keypad-key {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2px;
            min-height: 52px;
            border-radius: 1rem;
            font-weight: 700;
            touch-action: manipulation;
            user-select: none;
            transition: background-color 0.15s, transform 0.1s;
        }
        .keypad-key[data-key] {
            background: #f1f5f9;
            color: #334155;
            font-size: 1.5rem;
        }
        @media (hover: hover) {
            .keypad-key[data-key]:hover:not(:disabled) { background: #e2e8f0; }
        }
        .keypad-key:active:not(:disabled) { transform: scale(0.96); }
        .keypad-key:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
        .keypad-key:disabled { opacity: 0.45; cursor: default; }
        .ui-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }
        .keypad-key .ui-icon { width: 26px; height: 26px; }
        .control-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            flex-shrink: 0;
        }
        .control-button:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
        #checkLabel { font-size: 12px; line-height: 16px; }
        #answer:disabled {
            opacity: 1;
            -webkit-text-fill-color: #4f46e5;
        }
        /* Smooth progress bar transition */
        .progress-transition {
            transition: width 0.1s linear, background-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-[100dvh] flex items-start justify-center p-3 sm:p-4 sm:pt-20 font-sans text-slate-800 selection:bg-blue-200">

    <div class="bg-white rounded-3xl shadow-2xl p-5 sm:p-8 max-w-sm w-full text-center relative overflow-hidden border border-slate-100">
        
        <!-- Header Section -->
        <h1 class="text-2xl font-extrabold text-slate-700 mb-4 sm:mb-6 tracking-tight">Einmaleins Training</h1>
        
        <div class="flex justify-between items-center mb-4 space-x-2">
            <span id="progressIndicator" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 sm:px-3 py-1.5 rounded-full whitespace-nowrap">
                Bereit?
            </span>
            <div class="flex items-center space-x-1 sm:space-x-2">
                <span id="mistakeDisplay" class="text-sm font-bold text-rose-600 bg-rose-50 px-2 sm:px-3 py-1.5 rounded-full transition-all duration-300 flex items-center whitespace-nowrap">
                    Fehler: 0
                </span>
                <button id="resetBtn" aria-label="Neustart" class="control-button flex items-center justify-center p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-colors" title="Neustart">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10a9 9 0 1 1 2.7 8M3 4v6h6" /></svg>
                </button>
                <button id="openSettingsBtn" aria-label="Einstellungen" class="control-button flex items-center justify-center p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-colors" title="Einstellungen">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h4m4 0h10M3 17h10m4 0h4" /><circle cx="9" cy="7" r="2" /><circle cx="15" cy="17" r="2" /></svg>
                </button>
            </div>
        </div>

        <!-- Progress Bar Container -->
        <div class="w-full bg-slate-200 rounded-full h-2.5 mb-6 overflow-hidden">
            <div id="countdownBar" class="h-2.5 rounded-full bg-emerald-500 progress-transition w-full"></div>
        </div>

        <div id="startOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-10 flex flex-col items-center justify-center p-6 text-center rounded-3xl">
            <h2 class="text-2xl font-bold text-slate-800 mb-2" id="endTitle">Zeit-Challenge</h2>
            <p class="text-slate-600 mb-6" id="endDesc">Löse 10 Aufgaben bevor die Zeit abläuft!</p>
            <div class="flex flex-col space-y-3 w-full max-w-[200px]">
                <button id="startBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-2xl text-lg shadow-lg transition-transform active:scale-95">
                    Starten
                </button>
                <button id="startSettingsBtn" aria-label="Einstellungen" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-6 rounded-2xl text-base transition-colors flex items-center justify-center">
                    <svg class="ui-icon mr-1.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h4m4 0h10M3 17h10m4 0h4" /><circle cx="9" cy="7" r="2" /><circle cx="15" cy="17" r="2" /></svg>
                    Einstellungen
                </button>
            </div>
        </div>

        <!-- Settings Overlay -->
        <div id="settingsOverlay" class="absolute inset-0 bg-white z-20 hidden flex-col p-6 rounded-3xl overflow-y-auto text-left">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">Einstellungen</h2>
                <button id="closeSettingsBtn" aria-label="Einstellungen schließen" class="control-button text-slate-400 hover:text-slate-700 p-2 rounded-full hover:bg-slate-100 transition-colors">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" /></svg>
                </button>
            </div>
            
            <div class="mb-5">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Reihen (1-10)</h3>
                <div id="tableTogglesContainer" class="grid grid-cols-5 gap-2">
                    <!-- Toggles generated by JS -->
                </div>
                <p id="tableWarning" class="text-xs text-rose-500 mt-2 hidden">Bitte wähle mindestens eine Reihe aus.</p>
            </div>

            <div class="mb-5">
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Zeit-Faktor</h3>
                    <span id="timeFactorDisplay" class="font-bold text-indigo-600">3x</span>
                </div>
                <input type="range" id="timeFactorSlider" min="1" max="6" step="1" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                <p class="text-[10px] text-slate-400 mt-1">Zeit (Sek) = Ergebnis × Faktor</p>
            </div>

            <div class="mb-2">
                <div class="flex justify-between items-end mb-2">
                    <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Top 10 Fehler</h3>
                    <div class="flex space-x-3 text-[10px] font-medium text-slate-500">
                        <div class="flex items-center"><span class="w-2 h-2 rounded bg-rose-500 mr-1"></span>Falsch</div>
                        <div class="flex items-center"><span class="w-2 h-2 rounded bg-amber-400 mr-1"></span>Zeit</div>
                    </div>
                </div>
                <!-- Chart Container (Horizontal Bars) -->
                <div id="statsChart" class="flex flex-col space-y-2 border-b border-slate-200 pb-4 mt-4 max-h-48 overflow-y-auto">
                    <!-- Bars generated by JS -->
                </div>
                <div class="flex justify-end mt-2">
                     <button id="resetStatsBtn" class="text-[10px] text-slate-400 hover:text-rose-500 underline">Statistik zurücksetzen</button>
                </div>
            </div>
        </div>

        <!-- Math Problem Display -->
        <div id="question" class="text-6xl font-black text-slate-800 mb-4 tracking-tighter drop-shadow-sm select-none">
            <!-- Question injected via JS -->
        </div>

        <!-- Input and Controls -->
        <div class="space-y-4">
            <div class="relative w-32 mx-auto">
                <input type="text" id="answer" readonly inputmode="none" maxlength="3" aria-label="Ergebnis"
                    class="w-full text-center text-4xl font-bold text-indigo-600 border-b-4 border-slate-200 focus:border-indigo-500 focus:outline-none bg-transparent pb-2 transition-colors placeholder-slate-300"
                    placeholder="?" autocomplete="off">
            </div>
            
            <!-- Feedback Message Area -->
            <div class="h-6 flex items-center justify-center">
                <p id="feedback" role="status" class="text-base font-bold opacity-0 transition-opacity duration-200"></p>
            </div>

            <!-- Embedded Keypad -->
            <div id="keypad" role="group" aria-label="Zifferntastatur" class="grid grid-cols-3 gap-2">
                <button type="button" class="keypad-key" data-key="1">1</button>
                <button type="button" class="keypad-key" data-key="2">2</button>
                <button type="button" class="keypad-key" data-key="3">3</button>
                <button type="button" class="keypad-key" data-key="4">4</button>
                <button type="button" class="keypad-key" data-key="5">5</button>
                <button type="button" class="keypad-key" data-key="6">6</button>
                <button type="button" class="keypad-key" data-key="7">7</button>
                <button type="button" class="keypad-key" data-key="8">8</button>
                <button type="button" class="keypad-key" data-key="9">9</button>
                <button type="button" class="keypad-key" data-key="Backspace" aria-label="Letzte Ziffer löschen" title="Letzte Ziffer löschen">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M9 5h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-7-7 7-7Z M12 9l6 6m0-6-6 6" />
                    </svg>
                </button>
                <button type="button" class="keypad-key" data-key="0">0</button>
                <button type="button" id="checkBtn" title="Enter"
                    class="keypad-key bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm shadow-md">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path id="checkIcon" d="M20 5v7a3 3 0 0 1-3 3H4m5-5-5 5 5 5" />
                    </svg>
                    <span id="checkLabel">Prüfen</span>
                </button>
            </div>

            <!-- Keep the keypad in place when showing the multiplication table. -->
            <div id="visualAidContainer" class="flex justify-center"></div>
        </div>
    </div>

    <script>
        // Game State
        let currentA = 0;
        let currentB = 0;
        let correctAnswer = 0;
        let isWaitingForNext = false;
        let waitingForManualNext = false;
        
        // Settings & Stats State
        let config = {
            tables: [3, 4],
            timeFactor: 3
        };
        let stats = {};

        // Load Local Storage
        try {
            const savedConfig = localStorage.getItem('einmaleins_config');
            if (savedConfig) config = { ...config, ...JSON.parse(savedConfig) };
            
            const savedStats = localStorage.getItem('einmaleins_stats');
            if (savedStats) stats = JSON.parse(savedStats);
        } catch (e) {
            console.error("Could not load local storage", e);
        }

        function saveConfig() {
            localStorage.setItem('einmaleins_config', JSON.stringify(config));
        }

        function saveStats() {
            localStorage.setItem('einmaleins_stats', JSON.stringify(stats));
        }

        function logMistake(a, b, type) {
            const key = `${Math.min(a,b)}x${Math.max(a,b)}`;
            if (!stats[key]) {
                stats[key] = { wrong: 0, timeout: 0 };
            }
            stats[key][type]++;
            saveStats();
        }
        
        // Challenge State
        const TOTAL_QUESTIONS = 10;
        let questionCount = 0;
        let mistakes = 0;
        
        // Countdown State
        let timeRemainingMs = 0;
        let totalTimeMs = 0;
        let countdownInterval = null;
        let lastFrameTime = 0;

        // DOM Elements
        const questionEl = document.getElementById('question');
        const answerEl = document.getElementById('answer');
        const feedbackEl = document.getElementById('feedback');
        const checkBtn = document.getElementById('checkBtn');
        const checkLabel = document.getElementById('checkLabel');
        const checkIcon = document.getElementById('checkIcon');
        const keypad = document.getElementById('keypad');
        const entryKeys = keypad.querySelectorAll('[data-key]');
        const mistakeDisplay = document.getElementById('mistakeDisplay');
        const progressIndicator = document.getElementById('progressIndicator');
        const countdownBar = document.getElementById('countdownBar');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const startSettingsBtn = document.getElementById('startSettingsBtn');
        const endTitle = document.getElementById('endTitle');
        const endDesc = document.getElementById('endDesc');
        const resetBtn = document.getElementById('resetBtn');
        const visualAidContainer = document.getElementById('visualAidContainer');
        
        // Settings Elements
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const tableTogglesContainer = document.getElementById('tableTogglesContainer');
        const timeFactorSlider = document.getElementById('timeFactorSlider');
        const timeFactorDisplay = document.getElementById('timeFactorDisplay');
        const tableWarning = document.getElementById('tableWarning');
        const statsChart = document.getElementById('statsChart');
        const resetStatsBtn = document.getElementById('resetStatsBtn');

        function isGameVisible() {
            return startOverlay.classList.contains('hidden') && settingsOverlay.classList.contains('hidden');
        }

        function setCheckButton(state) {
            const states = {
                check: { label: 'Prüfen', icon: 'M20 5v7a3 3 0 0 1-3 3H4m5-5-5 5 5 5' },
                next: { label: 'Weiter', icon: 'M4 12h16m-7-7 7 7-7 7' },
                success: { label: 'Super!', icon: 'm5 12 4 4L19 6' }
            };
            checkLabel.textContent = states[state].label;
            checkIcon.setAttribute('d', states[state].icon);
        }

        function setAnswerEntryEnabled(enabled) {
            answerEl.disabled = !enabled;
            entryKeys.forEach(button => { button.disabled = !enabled; });
        }

        function editAnswer(key) {
            if (!isGameVisible() || isWaitingForNext || answerEl.disabled) return;
            if (key === 'Backspace' || key === 'Delete') {
                answerEl.value = answerEl.value.slice(0, -1);
            } else if (/^[0-9]$/.test(key) && answerEl.value.length < answerEl.maxLength) {
                answerEl.value += key;
            }
        }

        function updateMistakesUI() {
            mistakeDisplay.textContent = `Fehler: ${mistakes}`;
            if (mistakes > 0) {
                mistakeDisplay.classList.remove('text-rose-600', 'bg-rose-50');
                mistakeDisplay.classList.add('text-white', 'bg-rose-500');
            }
        }

        function stopCountdown() {
            if (countdownInterval) {
                cancelAnimationFrame(countdownInterval);
                countdownInterval = null;
            }
        }

        function updateCountdownBar(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const delta = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            timeRemainingMs -= delta;

            if (timeRemainingMs <= 0) {
                timeRemainingMs = 0;
                handleTimeOut();
            }

            const percentage = Math.max(0, (timeRemainingMs / totalTimeMs) * 100);
            countdownBar.style.width = `${percentage}%`;

            if (percentage > 50) {
                countdownBar.className = 'h-2.5 rounded-full progress-transition w-full bg-emerald-500';
            } else if (percentage > 25) {
                countdownBar.className = 'h-2.5 rounded-full progress-transition w-full bg-amber-500';
            } else {
                countdownBar.className = 'h-2.5 rounded-full progress-transition w-full bg-rose-500';
            }

            if (timeRemainingMs > 0 && !isWaitingForNext) {
                countdownInterval = requestAnimationFrame(updateCountdownBar);
            }
        }

        function startGame() {
            stopCountdown(); 
            questionCount = 0;
            mistakes = 0;
            updateMistakesUI();
            startOverlay.classList.add('hidden');
            generateQuestion();
        }

        function handleTimeOut() {
            if (isWaitingForNext) return;
            isWaitingForNext = true;
            waitingForManualNext = true;
            setAnswerEntryEnabled(false);
            
            mistakes++;
            updateMistakesUI();
            logMistake(currentA, currentB, 'timeout');
            
            feedbackEl.textContent = `Zu langsam! (${correctAnswer})`;
            feedbackEl.className = 'text-base font-bold text-rose-500';
            feedbackEl.style.opacity = '1';
            
            setCheckButton('next');
            checkBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            checkBtn.classList.add('bg-slate-500', 'hover:bg-slate-600');
            checkBtn.focus();
            
            showMultiplicationTableAid(currentA, currentB);
        }

        function generateQuestion() {
            if (questionCount >= TOTAL_QUESTIONS) {
                endGame(true);
                return;
            }
            
            if (config.tables.length === 0) config.tables = [3, 4];

            questionCount++;
            progressIndicator.textContent = `${questionCount} / ${TOTAL_QUESTIONS}`;
            isWaitingForNext = false;
            waitingForManualNext = false;
            
            const randomTableIndex = Math.floor(Math.random() * config.tables.length);
            currentA = config.tables[randomTableIndex];
            currentB = Math.floor(Math.random() * 10) + 1;
            correctAnswer = currentA * currentB;
            
            questionEl.textContent = `${currentA} × ${currentB}`;
            
            // Clear any previous visual aid
            visualAidContainer.innerHTML = '';
            
            const secondsGiven = Math.max(correctAnswer * config.timeFactor, 5); 
            totalTimeMs = secondsGiven * 1000;
            timeRemainingMs = totalTimeMs;
            
            countdownBar.style.width = '100%';
            countdownBar.className = 'h-2.5 rounded-full progress-transition w-full bg-emerald-500';

            answerEl.value = '';
            setAnswerEntryEnabled(true);
            answerEl.focus({ preventScroll: true });
            feedbackEl.style.opacity = '0';
            setCheckButton('check');
            checkBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600', 'bg-slate-500', 'hover:bg-slate-600');
            checkBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');

            stopCountdown();
            lastFrameTime = 0;
            countdownInterval = requestAnimationFrame(updateCountdownBar);
        }

        function showMultiplicationTableAid(highlightA, highlightB) {
            visualAidContainer.innerHTML = '';
            
            const tableGrid = document.createElement('div');
            tableGrid.className = 'grid grid-cols-11 gap-0.5 bg-slate-200 p-1 rounded-xl text-[10px] sm:text-xs font-semibold mx-auto';
            
            // Top-left empty corner cell
            const corner = document.createElement('div');
            corner.className = 'bg-slate-300 text-slate-600 flex items-center justify-center rounded-sm w-5 h-5 sm:w-6 sm:h-6';
            corner.textContent = '×';
            tableGrid.appendChild(corner);
            
            // Column headers (1 to 10)
            for (let c = 1; c <= 10; c++) {
                const colHead = document.createElement('div');
                colHead.className = `flex items-center justify-center rounded-sm w-5 h-5 sm:w-6 sm:h-6 ${c === highlightB ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-100 text-slate-700'}`;
                colHead.textContent = c;
                tableGrid.appendChild(colHead);
            }
            
            // Rows (1 to 10)
            for (let r = 1; r <= 10; r++) {
                // Row header
                const rowHead = document.createElement('div');
                rowHead.className = `flex items-center justify-center rounded-sm w-5 h-5 sm:w-6 sm:h-6 ${r === highlightA ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-100 text-slate-700'}`;
                rowHead.textContent = r;
                tableGrid.appendChild(rowHead);
                
                // Row cells
                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    const isTarget = (r === highlightA && c === highlightB);
                    
                    cell.className = `flex items-center justify-center rounded-sm w-5 h-5 sm:w-6 sm:h-6 transition-all ${
                        isTarget 
                            ? 'bg-rose-500 text-white font-bold scale-110 shadow-md ring-2 ring-rose-300 z-10' 
                            : 'bg-white text-slate-600 hover:bg-slate-50'
                    }`;
                    cell.textContent = r * c;
                    tableGrid.appendChild(cell);
                }
            }
            
            visualAidContainer.appendChild(tableGrid);
        }

        function checkAnswer() {
            if (!isGameVisible()) return;
            if (waitingForManualNext) {
                waitingForManualNext = false;
                if (questionCount >= TOTAL_QUESTIONS) {
                    endGame(true);
                } else {
                    generateQuestion();
                }
                return;
            }

            if (isWaitingForNext) return;

            const userAnswer = parseInt(answerEl.value, 10);

            if (isNaN(userAnswer)) {
                answerEl.focus();
                return;
            }

            if (userAnswer === correctAnswer) {
                isWaitingForNext = true;
                setAnswerEntryEnabled(false);
                stopCountdown();
                
                feedbackEl.textContent = 'Richtig!';
                feedbackEl.className = 'text-base font-bold text-emerald-600';
                feedbackEl.style.opacity = '1';
                
                setCheckButton('success');
                checkBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                checkBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                
                setTimeout(generateQuestion, 500);
            } else {
                mistakes++;
                updateMistakesUI();
                logMistake(currentA, currentB, 'wrong');
                
                isWaitingForNext = true;
                waitingForManualNext = true;
                setAnswerEntryEnabled(false);
                stopCountdown();
                
                feedbackEl.textContent = `Falsch! Lösung: ${correctAnswer}`;
                feedbackEl.className = 'text-base font-bold text-rose-500';
                feedbackEl.style.opacity = '1';
                
                setCheckButton('next');
                checkBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                checkBtn.classList.add('bg-slate-500', 'hover:bg-slate-600');
                checkBtn.focus();
                
                showMultiplicationTableAid(currentA, currentB);
                
                answerEl.classList.remove('shake');
                void answerEl.offsetWidth; // trigger reflow
                answerEl.classList.add('shake');
            }
        }

        checkBtn.addEventListener('click', checkAnswer);
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', startGame);
        
        keypad.addEventListener('click', (e) => {
            const key = e.target.closest('[data-key]');
            if (key) editAnswer(key.dataset.key);
        });

        // A physical keyboard still works, including after clicking keypad buttons.
        document.addEventListener('keydown', (e) => {
            if (!isGameVisible() || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
            const target = e.target;
            if (target !== answerEl && !keypad.contains(target) &&
                target.closest('button, input, select, textarea, a, [contenteditable]')) return;

            if (e.key === 'Enter') {
                e.preventDefault();
                if (!e.repeat) checkAnswer();
            } else if (/^[0-9]$/.test(e.key) || e.key === 'Backspace' || e.key === 'Delete') {
                e.preventDefault();
                editAnswer(e.key);
            }
        });

        // --- Settings & Stats Implementation ---

        function renderSettings() {
            tableTogglesContainer.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                const isSelected = config.tables.includes(i);
                btn.textContent = i;
                btn.className = `py-2 rounded-lg font-bold text-sm transition-colors ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`;
                btn.onclick = () => toggleTable(i, btn);
                tableTogglesContainer.appendChild(btn);
            }
            
            timeFactorSlider.value = config.timeFactor;
            timeFactorDisplay.textContent = config.timeFactor + 'x';
            
            renderChart();
        }

        function toggleTable(num, btnEl) {
            const idx = config.tables.indexOf(num);
            if (idx > -1) {
                if (config.tables.length <= 1) {
                    tableWarning.classList.remove('hidden');
                    setTimeout(() => tableWarning.classList.add('hidden'), 2000);
                    return;
                }
                config.tables.splice(idx, 1);
                btnEl.className = 'py-2 rounded-lg font-bold text-sm transition-colors bg-slate-100 text-slate-500 hover:bg-slate-200';
            } else {
                config.tables.push(num);
                btnEl.className = 'py-2 rounded-lg font-bold text-sm transition-colors bg-indigo-600 text-white shadow-md';
            }
            saveConfig();
        }

        function renderChart() {
            statsChart.innerHTML = '';
            
            const statsArray = Object.entries(stats).map(([key, data]) => {
                return { task: key, wrong: data.wrong, timeout: data.timeout, total: data.wrong + data.timeout };
            }).filter(item => item.total > 0);
            
            if (statsArray.length === 0) {
                statsChart.innerHTML = '<div class="w-full text-center text-xs text-slate-400 py-6">Noch keine Fehler aufgezeichnet.</div>';
                return;
            }

            statsArray.sort((a, b) => b.total - a.total);
            const top10 = statsArray.slice(0, 10);
            const maxErrors = Math.max(...top10.map(item => item.total));

            top10.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex items-center space-x-2 text-xs group relative';
                
                const tooltip = document.createElement('div');
                tooltip.className = 'absolute -top-7 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-30 shadow-lg';
                tooltip.innerHTML = `<b>${item.task}</b>: ${item.wrong} Falsch, ${item.timeout} Zeit`;

                const label = document.createElement('div');
                label.className = 'w-12 font-bold text-slate-600 text-right flex-shrink-0';
                label.textContent = item.task;

                const barWrapper = document.createElement('div');
                barWrapper.className = 'flex-1 bg-slate-100 h-5 rounded overflow-hidden flex';

                const wrongPct = (item.wrong / maxErrors) * 100;
                const timeoutPct = (item.timeout / maxErrors) * 100;

                if (item.wrong > 0) {
                    const wrongBar = document.createElement('div');
                    wrongBar.className = 'bg-rose-500 h-full transition-all duration-500';
                    wrongBar.style.width = `${wrongPct}%`;
                    barWrapper.appendChild(wrongBar);
                }

                if (item.timeout > 0) {
                    const timeoutBar = document.createElement('div');
                    timeoutBar.className = 'bg-amber-400 h-full transition-all duration-500';
                    timeoutBar.style.width = `${timeoutPct}%`;
                    barWrapper.appendChild(timeoutBar);
                }

                const countBadge = document.createElement('div');
                countBadge.className = 'w-6 text-left text-[10px] font-bold text-slate-400 flex-shrink-0';
                countBadge.textContent = `(${item.total})`;

                row.appendChild(tooltip);
                row.appendChild(label);
                row.appendChild(barWrapper);
                row.appendChild(countBadge);
                
                statsChart.appendChild(row);
            });
        }

        openSettingsBtn.addEventListener('click', () => {
            stopCountdown(); 
            renderSettings();
            settingsOverlay.classList.remove('hidden');
            settingsOverlay.classList.add('flex');
        });

        startSettingsBtn.addEventListener('click', () => {
            renderSettings();
            settingsOverlay.classList.remove('hidden');
            settingsOverlay.classList.add('flex');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.add('hidden');
            settingsOverlay.classList.remove('flex');
            
            const tablesStr = config.tables.sort((a,b)=>a-b).join(', ');
            document.title = `Einmaleins: ${tablesStr}`;
            document.querySelector('h1').textContent = `Reihen: ${tablesStr}`;

            startGame();
        });

        timeFactorSlider.addEventListener('input', (e) => {
            config.timeFactor = parseInt(e.target.value);
            timeFactorDisplay.textContent = config.timeFactor + 'x';
            saveConfig();
        });

        resetStatsBtn.addEventListener('click', () => {
            if(confirm('Möchtest du die Fehler-Statistik wirklich zurücksetzen?')) {
                stats = {};
                saveStats();
                renderChart();
            }
        });
        
        document.querySelector('h1').textContent = `Reihen: ${config.tables.sort((a,b)=>a-b).join(', ')}`;

    </script>
</body>
</html>
